name: Actualizar seguidores

on:
  schedule:
    - cron: "*/20 * * * *"   # cada 20 minutos (GitHub a veces lo retrasa unos minutos)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: seguidores
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python actualizar.py
      - name: Guardar si ha cambiado
        run: |
          if git diff --quiet seguidores.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "contador-seguidores"
          git config user.email "contador-seguidores@users.noreply.github.com"
          git add seguidores.json
          git commit -m "Seguidores actualizados"
          git pull --rebase
          git push
